plugins {
    id 'groovy'
    id 'codenarc'
}

dependencies {
    implementation localGroovy()

    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-3.0')
    testImplementation 'org.spockframework:spock-core'
}

def generatedHubitatSources = layout.buildDirectory.dir('generated/hubitatGroovy')

tasks.register('updateReleaseMetadata') {
    outputs.file('packageManifest.json')

    doLast {
        def releaseVersion = project.findProperty('releaseVersion')?.toString()?.trim()
        if (!releaseVersion) {
            throw new GradleException('releaseVersion is required. Example: -PreleaseVersion=0.2.112')
        }

        def manifestFile = file('packageManifest.json')
        def manifest = manifestFile.exists() ? new groovy.json.JsonSlurper().parseText(manifestFile.text) : [:]
        manifest.version = releaseVersion
        manifest.dateReleased = project.findProperty('releaseDate')?.toString()?.trim() ?: new Date().format('yyyy-MM-dd')

        def releaseNotes = project.findProperty('releaseNotes')?.toString()?.trim()
        if (releaseNotes) {
            manifest.releaseNotes = releaseNotes
        } else if (!manifest.releaseNotes) {
            manifest.releaseNotes = "Release ${releaseVersion}."
        }

        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + System.lineSeparator()
    }
}

tasks.register('generatePackageManifest') {
    inputs.files fileTree('apps') { include '**/*.groovy' }
    inputs.files fileTree('drivers') { include '**/*.groovy' }
    inputs.files fileTree('libraries') { include '**/*.groovy' }
    outputs.file('packageManifest.json')

    doLast {
        def manifestFile = file('packageManifest.json')
        def currentManifest = manifestFile.exists() ? new groovy.json.JsonSlurper().parseText(manifestFile.text) : [:]
        def repoRoot = 'https://raw.githubusercontent.com/hrerikl/hubitat-room-state-manager/main/'
        def stableComponentIds = [
            'apps/SimpleHome.groovy'                       : 'b7af26b8-9787-46d7-857e-ea8c85b920e0',
            'apps/SimpleRoomState.groovy'                  : '14661fd7-420a-40f0-bbca-fbf77ce7aa39',
            'apps/SimpleModeManager.groovy'                : '5d6a0a37-9201-42b6-9655-729fdc506d2d',
            'apps/SimpleRoomLighting.groovy'               : '80f6efa1-1ba6-42e2-845f-a5b92161f85f',
            'apps/SimpleHouseIntentLighting.groovy'        : '297b24d4-7f07-4f9d-930d-96067a03a8a7',
            'apps/SimpleCircadianLighting.groovy'          : 'e8a46264-a0f2-4d7f-9b3f-a6b05b2fe2a0',
            'drivers/SimpleRoomMetaDevice.groovy'          : '6f05522a-f03d-4bd6-b7fe-9298ac70242d',
            'drivers/SimpleRoomMetaLightDevice.groovy'     : 'f3edda6e-1a13-4f15-b4b1-79d3d07b6eca',
            'drivers/SimpleRoomChildSwitchDevice.groovy'   : 'ff90bef0-f629-4762-9dcc-ae166cfbc065',
            'drivers/SimpleOpenMeteoOutdoorLightDevice.groovy': '9cd84d59-77cc-4ff6-8b7d-0865ebf90345',
            'libraries/SimpleHomeHelpers.groovy'            : '68aa9872-a552-48c7-8524-4dfb9ccc1853'
        ]
        def stableRequired = [
            'apps/SimpleHouseIntentLighting.groovy': false
        ]

        def parseDefinitionValue = { String text, String key ->
            def matcher = text =~ /${key}\s*:\s*['\"]([^'\"]+)['\"]/
            return matcher.find() ? matcher[0][1] : null
        }

        def currentEntries = ((currentManifest.apps ?: []) + (currentManifest.drivers ?: []) + (currentManifest.files ?: []))
        def existingEntryFor = { String location ->
            currentEntries.find { entry -> entry.location == location }
        }

        def entryFor = { File sourceFile, String kind ->
            def text = sourceFile.text
            def name = parseDefinitionValue(text, 'name') ?: sourceFile.name.replaceAll(/\.groovy$/, '')
            def namespace = parseDefinitionValue(text, 'namespace') ?: 'lundby'
            def relativePath = "${kind}/${sourceFile.name}".toString()
            def location = "${repoRoot}${relativePath}"
            def existing = existingEntryFor(location)
            def description = existing?.description ?: parseDefinitionValue(text, 'description') ?: "${name} (${kind})"
            def category = existing?.category ?: parseDefinitionValue(text, 'category') ?: 'Convenience'
            def primary = sourceFile.name == 'SimpleHome.groovy'
            def deterministicId = UUID.nameUUIDFromBytes("lundby:${relativePath}".bytes).toString()

            return [
                id: stableComponentIds[relativePath] ?: existing?.id ?: deterministicId,
                name: name,
                namespace: namespace,
                location: location,
                required: stableRequired.containsKey(relativePath) ? stableRequired[relativePath] : (existing?.required == null ? true : existing.required),
                oauth: existing?.oauth == null ? false : existing.oauth,
                primary: primary,
                category: category,
                description: description
            ]
        }

        def excludedApps = ['SimpleHomeDev.groovy', 'LundbyOpenClawBridge.groovy'] as Set
        def apps = file('apps').listFiles()?.findAll { it.name.endsWith('.groovy') && !excludedApps.contains(it.name) }?.sort { it.name }?.collect { entryFor(it, 'apps') }
        def drivers = file('drivers').listFiles()?.findAll { it.name.endsWith('.groovy') }?.sort { it.name }?.collect { entryFor(it, 'drivers') }
        def files = file('libraries').listFiles()?.findAll { it.name.endsWith('.groovy') }?.sort { it.name }?.collect { entryFor(it, 'libraries') }

        def generatedManifest = [
            packageName: currentManifest.packageName ?: 'Simple Home',
            author: currentManifest.author ?: 'Erik Lundby',
            version: currentManifest.version ?: '0.0.0',
            minimumHEVersion: currentManifest.minimumHEVersion ?: '2.3.0',
            dateReleased: currentManifest.dateReleased ?: new Date().format('yyyy-MM-dd'),
            releaseNotes: currentManifest.releaseNotes ?: 'Generated from app and driver source files.',
            category: currentManifest.category ?: 'Convenience',
            tags: currentManifest.tags ?: 'Lights & Switches, Presence & Location',
            documentationLink: currentManifest.documentationLink ?: 'https://github.com/hrerikl/hubitat-room-state-manager',
            communityLink: currentManifest.communityLink ?: 'https://github.com/hrerikl/hubitat-room-state-manager',
            apps: apps ?: [],
            files: files ?: currentManifest.files ?: [],
            drivers: drivers ?: []
        ]

        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(generatedManifest)) + System.lineSeparator()
    }
}

tasks.register('generateHubitatSources') {
    inputs.files fileTree('apps') { include '**/*.groovy' }
    inputs.files fileTree('drivers') { include '**/*.groovy' }
    inputs.files fileTree('src/main/groovy') { include '**/*.groovy' }
    inputs.files fileTree('libraries') { include '**/*.groovy' }
    outputs.dir generatedHubitatSources

    doLast {
        def outputDir = generatedHubitatSources.get().asFile
        delete outputDir

        def librarySource = file('libraries/SimpleHomeHelpers.groovy')
        def libraryBody = ''
        if (librarySource.exists()) {
            libraryBody = librarySource.text.replaceFirst(/(?s)^\s*(?:\/\*.*?\*\/\s*)?library\s*\(.*?\)\s*/, '')
        }

        def expandIncludes = { String text ->
            text.readLines().collect { line ->
                line == '#include lundby.SimpleHomeHelpers' ? libraryBody : line
            }.join(System.lineSeparator()) + System.lineSeparator()
        }

        [
            [dir: file('apps'), prefix: 'apps'],
            [dir: file('drivers'), prefix: 'drivers'],
            [dir: file('src/main/groovy'), prefix: 'src/main/groovy']
        ].each { sourceRoot ->
            if (!sourceRoot.dir.exists()) return
            fileTree(sourceRoot.dir) { include '**/*.groovy' }.each { sourceFile ->
                def relativePath = sourceRoot.dir.toPath().relativize(sourceFile.toPath()).toString()
                def targetFile = new File(outputDir, "${sourceRoot.prefix}/${relativePath}")
                targetFile.parentFile.mkdirs()
                targetFile.text = expandIncludes(sourceFile.text)
            }
        }
    }
}

tasks.register('packageHubitat', Zip) {
    dependsOn tasks.named('generatePackageManifest')
    archiveBaseName.set('SimpleHome')
    destinationDirectory.set(layout.buildDirectory.dir('hubitatPackage'))
    from('packageManifest.json')
    from('apps') { include '**/*.groovy'; exclude 'SimpleHomeDev.groovy'; exclude 'LundbyOpenClawBridge.groovy'; into('apps') }
    from('drivers') { include '**/*.groovy'; into('drivers') }
    from('libraries') { include '**/*.groovy'; into('libraries') }
}

tasks.register('verifyHubitatPackage') {
    dependsOn tasks.named('packageHubitat')

    doLast {
        def manifestFile = file('packageManifest.json')
        def manifest = new groovy.json.JsonSlurper().parseText(manifestFile.text)
        def entries = (manifest.apps ?: []) + (manifest.files ?: []) + (manifest.drivers ?: [])
        def duplicateIds = entries.groupBy { it.id }.findAll { id, matches -> matches.size() > 1 }.keySet()
        if (duplicateIds) {
            throw new GradleException("Duplicate HPM component IDs: ${duplicateIds.join(', ')}")
        }

        def helperEntry = (manifest.files ?: []).find { it.name == 'SimpleHomeHelpers' && it.location?.endsWith('/libraries/SimpleHomeHelpers.groovy') }
        if (!helperEntry) {
            throw new GradleException('SimpleHomeHelpers library is missing from packageManifest.json files.')
        }

        def zipFile = layout.buildDirectory.file('hubitatPackage/SimpleHome.zip').get().asFile
        if (!zipFile.exists()) {
            throw new GradleException("Package ZIP not found: ${zipFile}")
        }

        def zip = new java.util.zip.ZipFile(zipFile)
        try {
            [
                'packageManifest.json',
                'libraries/SimpleHomeHelpers.groovy',
                'apps/SimpleHome.groovy',
                'apps/SimpleRoomState.groovy',
                'apps/SimpleRoomLighting.groovy',
                'drivers/SimpleRoomMetaDevice.groovy'
            ].each { path ->
                if (!zip.getEntry(path)) {
                    throw new GradleException("Package ZIP is missing ${path}")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.register('releaseHubitatPackage') {
    dependsOn tasks.named('updateReleaseMetadata')
    dependsOn tasks.named('check')
    dependsOn tasks.named('verifyHubitatPackage')
}

tasks.named('generatePackageManifest') {
    mustRunAfter tasks.named('updateReleaseMetadata')
}

tasks.named('check') {
    mustRunAfter tasks.named('updateReleaseMetadata')
}

tasks.named('packageHubitat') {
    mustRunAfter tasks.named('check')
}

tasks.named('verifyHubitatPackage') {
    mustRunAfter tasks.named('packageHubitat')
}

sourceSets {
    main {
        groovy {
            srcDirs = [generatedHubitatSources]
        }
    }
    test {
        groovy {
            srcDirs = ['src/test/groovy']
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.named('compileGroovy') {
    dependsOn tasks.named('generateHubitatSources')
}

tasks.named('codenarcMain') {
    dependsOn tasks.named('generateHubitatSources')
}

codenarc {
    toolVersion = '3.3.0'
    configFile = file('config/codenarc/codenarc.groovy')
    ignoreFailures = true
}
